[env:nrf52832_custom]
extra_scripts = upload_hooks.py
platform = nordicnrf52
board = adafruit_feather_nrf52832
framework = arduino

; Upload via CMSIS-DAP (DAPLink) - J-Link OB DAPLink programmer
upload_protocol = custom
debug_tool = cmsis-dap
upload_command = C:/Users/harsh/.platformio/packages/tool-openocd/bin/openocd.exe -s C:/Users/harsh/.platformio/packages/tool-openocd/openocd/scripts -f interface/cmsis-dap.cfg -f target/nrf52.cfg -c "program {.pio/build/nrf52832_custom/firmware.bin} 0x26000 verify; program {.pio/build/nrf52832_custom/firmware_signature.bin} 0x7F000 verify reset; shutdown"

; Serial monitor speed
monitor_port = socket://localhost:9090
monitor_speed = 115200

build_flags =
    -I include
    -DNRF52832_XXAA        ; ensure nRF52832 register map is included
    -DDEBUG_LOGGING

lib_deps =
    koendv/RTT Stream@^1.3.0
    adafruit/Adafruit LIS3DH
    adafruit/Adafruit Unified Sensor
    mathertel/OneButton@^2.5.0

